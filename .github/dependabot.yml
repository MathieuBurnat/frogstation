# Mises à jour de dépendances — audit FRO-4 (S-05).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Une PR groupée pour l'outillage, les correctifs de sécurité restent isolés.
      dev-dependencies:
        dependency-type: development

  # Les actions GitHub sont aussi du code exécuté dans la CI.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
