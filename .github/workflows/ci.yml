# Garde-fous automatiques sur chaque PR — audit FRO-4 (S-05).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Lecture seule : ce workflow ne publie rien.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ⚠️ L'identifiant de ce job (`verify`) est publié tel quel comme nom de check,
  # et c'est le contexte exigé par la protection de branche sur `main` (FRO-23).
  # Volontairement pas de `name:` ici : un nom d'affichage remplacerait le nom du
  # check, le contexte `verify` ne remonterait jamais, et le statut global de
  # chaque PR resterait `pending` pour toujours — donc plus aucune fusion
  # possible (FRO-26). Renommer ce job = casser silencieusement la protection.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci (et non npm install) : échoue si le lockfile et package.json
      # divergent, et n'installe que les versions figées (S-01).
      - run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run build
