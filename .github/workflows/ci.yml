# Garde-fous automatiques sur chaque PR — audit FRO-4 (S-05).
# Déploiement Cloudflare Workers — FRO-19.
#
# Un seul workflow, quatre jobs, dans cet ordre :
#   verify  -> gate -> deploy-preview      (pull request)
#                   \-> deploy-production  (push sur main)
#
# Le déploiement dépend de `verify` : rien ne part vers Cloudflare sans que
# l'audit, le typecheck, le lint et le build soient verts.
#
# Les jobs de déploiement ne rejouent pas le build ici : c'est `wrangler` qui
# l'exécute, via `[build] command` dans wrangler.toml. Le build de déploiement
# est ainsi défini à un seul endroit, valable pour GitHub Actions, pour un poste
# de dev et pour Cloudflare Workers Builds. `verify` publie tout de même dist/
# comme artefact, pour que la QA puisse télécharger le build exact d'une PR.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Lecture seule par défaut ; chaque job qui a besoin de plus le redéclare.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # On annule les runs de PR obsolètes, jamais un déploiement de production
  # en cours.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pas de télémétrie Wrangler depuis la CI.
  WRANGLER_SEND_METRICS: false
  # Version de Wrangler figée : la chaîne de déploiement doit être reproductible
  # au même titre que les dépendances du site.
  WRANGLER_VERSION: "4.141.0"

jobs:
  verify:
    # Nom volontairement court et en ASCII : c'est le contexte utilisé comme
    # check obligatoire dans la protection de `main`. Le renommer casse la règle
    # de protection de branche.
    name: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vérifie l'épinglage de *toutes* les actions de .github/, y compris les
      # workflows futurs. Placé avant toute autre étape : rien d'autre ne tourne
      # si la chaîne d'approvisionnement de la CI n'est pas figée (FRO-23, P-02).
      - name: actions épinglées à un SHA
        run: ./scripts/check-action-pins.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci (et non npm install) : échoue si le lockfile et package.json
      # divergent, et n'installe que les versions figées (S-01).
      - run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run build

      # Vérifie que le build a bien produit les deux entrées HTML et que les
      # en-têtes de sécurité ont suivi dans dist/ — sans ça, le déploiement
      # publierait un site sans CSP sans que personne ne le voie.
      - name: Vérifier le contenu de dist/
        run: |
          for f in dist/index.html dist/404.html dist/_headers; do
            if [ ! -f "$f" ]; then
              echo "::error::$f est absent du build"
              exit 1
            fi
          done
          echo "dist/index.html, dist/404.html et dist/_headers sont présents."

      # Pour que la QA puisse télécharger le build exact d'une PR. Les jobs de
      # déploiement ne s'en servent pas : c'est wrangler qui rebuild (voir
      # `[build] command` dans wrangler.toml).
      - name: Publier l'artefact dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  # Les secrets Cloudflare ne sont pas encore renseignés (FRO-2). Ce job décide
  # si le déploiement peut avoir lieu, pour que l'absence de secret laisse la CI
  # verte au lieu de la faire échouer en rouge à chaque PR.
  #
  # Il ne teste que la *présence* d'une valeur non vide : rien n'est affiché.
  gate:
    name: gate
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      can-deploy: ${{ steps.check.outputs.can-deploy }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "can-deploy=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets Cloudflare présents — le déploiement va s'exécuter."
          else
            echo "can-deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN et/ou CLOUDFLARE_ACCOUNT_ID absents des GitHub Secrets — déploiement ignoré (voir README, section Déploiement)."
          fi

  # Préversion par pull request : Workers Preview nommée `pr-<numéro>`, donc une
  # URL stable et réutilisée à chaque nouveau commit de la même PR.
  #
  # Garde-fou fork : une PR venant d'un fork n'a de toute façon pas accès aux
  # secrets (`gate` renverrait false), mais on l'exclut explicitement — et on
  # n'utilise **jamais** `pull_request_target`, qui exécuterait du code non fiable
  # avec les secrets du dépôt.
  deploy-preview:
    name: Préversion Cloudflare
    needs: [verify, gate]
    if: >-
      github.event_name == 'pull_request'
      && needs.gate.outputs.can-deploy == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pour poster l'URL de préversion en commentaire de PR.
      pull-requests: write
      # Pour que wrangler-action crée l'entrée « Deployment » GitHub.
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Nécessaire pour que le `[build] command` de wrangler.toml puisse tourner.
      - run: npm ci

      - name: Publier la préversion
        id: preview
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: preview --name pr-${{ github.event.pull_request.number }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # L'URL passe par l'environnement, jamais par interpolation directe dans le
      # script : une expression ${{ }} interpolée dans un `run` est une injection
      # de script en puissance.
      - name: Commenter l'URL de préversion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
          COMMIT_URL: ${{ steps.preview.outputs.preview-deployment-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="$(printf '%s\n' \
            "### 🐸 Préversion déployée" \
            "" \
            "| | |" \
            "| --- | --- |" \
            "| URL stable de la PR | $PREVIEW_URL |" \
            "| URL de ce commit | $COMMIT_URL |" \
            "| Commit | \`${SHA}\` |" \
            "" \
            "À vérifier côté QA : un chemin inconnu (par ex. \`/nope\`) doit renvoyer un vrai statut HTTP 404." \
            "" \
            "<sub>Commentaire mis à jour automatiquement à chaque commit de cette PR.</sub>")"
          gh pr comment "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "$body" \
            --edit-last --create-if-none

  deploy-production:
    name: Production Cloudflare
    needs: [verify, gate]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.gate.outputs.can-deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Nécessaire pour que le `[build] command` de wrangler.toml puisse tourner.
      - run: npm ci

      - name: Déployer en production
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Récapitulatif
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "### 🚀 Production déployée"
            echo ""
            echo "- URL : $DEPLOYMENT_URL"
            echo "- Commit : \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
