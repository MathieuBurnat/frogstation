# Garde-fous automatiques sur chaque PR — audit FRO-4 (S-05).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Lecture seule : ce workflow ne publie rien.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: audit · typecheck · lint · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci (et non npm install) : échoue si le lockfile et package.json
      # divergent, et n'installe que les versions figées (S-01).
      - run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run build
