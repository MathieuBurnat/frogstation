# Garde-fous automatiques sur chaque PR — audit FRO-4 (S-05), durci par FRO-23.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Lecture seule : ce workflow ne publie rien.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ⚠️ L'identifiant de ce job (`verify`) est le nom du check requis par la
  # protection de branche sur `main`. Volontairement pas de `name:` ici : un nom
  # d'affichage changerait le nom du check et casserait silencieusement la
  # protection de branche (le check requis ne remonterait jamais).
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions épinglées à un SHA de commit complet : un tag est déplaçable,
      # un SHA non (FRO-23, P-02). Le commentaire donne la version lisible ;
      # Dependabot sait mettre à jour ce couple SHA + commentaire.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Vérifie l'épinglage de *toutes* les actions de .github/, y compris les
      # workflows futurs (déploiement Cloudflare notamment). Placé avant toute
      # autre étape : rien d'autre ne tourne si la chaîne n'est pas figée.
      - name: actions épinglées à un SHA
        run: ./scripts/check-action-pins.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci (et non npm install) : échoue si le lockfile et package.json
      # divergent, et n'installe que les versions figées (S-01).
      - run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run build
