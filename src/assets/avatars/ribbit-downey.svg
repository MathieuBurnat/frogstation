<!-- Avatar Ribbit Downey — casque audio et chevrons du front-end. Charte FRO-18. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="rd-title">
  <title id="rd-title">Avatar de Ribbit Downey, une grenouille au casque audio entourée de chevrons de code</title>
  <circle cx="60" cy="60" r="60" fill="#d7ebd9" />
  <ellipse cx="60" cy="104" rx="36" ry="8" fill="#15653f" opacity="0.14" />
  <!-- Arceau du casque -->
  <path d="M24 56c0-21 16-36 36-36s36 15 36 36" fill="none" stroke="#123a2a" stroke-width="7" stroke-linecap="round" />
  <!-- Bulbes oculaires -->
  <circle cx="41" cy="46" r="14" fill="#1b7a4d" />
  <circle cx="79" cy="46" r="14" fill="#1b7a4d" />
  <circle cx="41" cy="45" r="8.5" fill="#ffffff" />
  <circle cx="79" cy="45" r="8.5" fill="#ffffff" />
  <circle cx="41" cy="46" r="4.2" fill="#10231a" />
  <circle cx="79" cy="46" r="4.2" fill="#10231a" />
  <circle cx="39" cy="43" r="1.6" fill="#ffffff" />
  <circle cx="77" cy="43" r="1.6" fill="#ffffff" />
  <!-- Tête -->
  <path d="M60 46c-19 0-33 12-33 28 0 15 15 24 33 24s33-9 33-24c0-16-14-28-33-28Z" fill="#15653f" />
  <path d="M60 78c-11 0-20 4-24 10 5 6 14 10 24 10s19-4 24-10c-4-6-13-10-24-10Z" fill="#8fe0b4" opacity="0.55" />
  <path d="M42 74c6 7 30 7 36 0" fill="none" stroke="#0b2019" stroke-width="3" stroke-linecap="round" />
  <!-- Oreillettes -->
  <rect x="14" y="48" width="16" height="26" rx="8" fill="#123a2a" />
  <rect x="90" y="48" width="16" height="26" rx="8" fill="#123a2a" />
  <rect x="18" y="54" width="8" height="14" rx="4" fill="#ffd166" />
  <rect x="94" y="54" width="8" height="14" rx="4" fill="#ffd166" />
  <!-- Chevrons de code -->
  <path d="M34 92l-6 6 6 6M86 92l6 6-6 6" fill="none" stroke="#b0175e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
