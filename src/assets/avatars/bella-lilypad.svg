<!-- Avatar Bella Lilypad — loupe et checklist de la recette QA. Charte FRO-18. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="bl-title">
  <title id="bl-title">Avatar de Bella Lilypad, une grenouille fleurie de nénuphar tenant une loupe</title>
  <circle cx="60" cy="60" r="60" fill="#fbe7ee" />
  <ellipse cx="60" cy="104" rx="36" ry="8" fill="#15653f" opacity="0.14" />
  <!-- Fleur de nénuphar posée sur la tête -->
  <g transform="translate(60 22)">
    <g fill="#f6a8c6" stroke="#b0175e" stroke-width="1.6">
      <ellipse cx="0" cy="-8" rx="4.5" ry="9" />
      <ellipse cx="-9" cy="-3" rx="4.5" ry="9" transform="rotate(-40 -9 -3)" />
      <ellipse cx="9" cy="-3" rx="4.5" ry="9" transform="rotate(40 9 -3)" />
    </g>
    <circle cy="-2" r="4" fill="#ffd166" stroke="#8a5a00" stroke-width="1.4" />
  </g>
  <!-- Bulbes oculaires -->
  <circle cx="41" cy="46" r="14" fill="#35906a" />
  <circle cx="79" cy="46" r="14" fill="#35906a" />
  <circle cx="41" cy="45" r="8.5" fill="#ffffff" />
  <circle cx="79" cy="45" r="8.5" fill="#ffffff" />
  <circle cx="41.5" cy="46" r="4.2" fill="#10231a" />
  <circle cx="79.5" cy="46" r="4.2" fill="#10231a" />
  <circle cx="39" cy="43" r="1.6" fill="#ffffff" />
  <circle cx="77" cy="43" r="1.6" fill="#ffffff" />
  <!-- Tête -->
  <path d="M60 46c-19 0-33 12-33 28 0 15 15 24 33 24s33-9 33-24c0-16-14-28-33-28Z" fill="#2e7d5b" />
  <path d="M60 78c-11 0-20 4-24 10 5 6 14 10 24 10s19-4 24-10c-4-6-13-10-24-10Z" fill="#8fe0b4" opacity="0.5" />
  <path d="M42 73c6 8 30 8 36 0" fill="none" stroke="#0b2019" stroke-width="3" stroke-linecap="round" />
  <circle cx="34" cy="71" r="3.4" fill="#b0175e" opacity="0.55" />
  <circle cx="86" cy="71" r="3.4" fill="#b0175e" opacity="0.55" />
  <!-- Loupe, posée sur l'épaule droite -->
  <g stroke="#b0175e" stroke-width="4" fill="none" stroke-linecap="round">
    <circle cx="93" cy="84" r="11" fill="#ffffff" fill-opacity="0.75" />
    <path d="M101 92l8 9" />
  </g>
  <!-- Deux coches validées -->
  <path d="M18 80l5 5 9-10M18 96l5 5 9-10" fill="none" stroke="#15653f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
